<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Práctica de Agregación - IS2</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #18181b; color: #f4f4f5; padding: 30px; display: flex; justify-content: center; }
    .card { background: #27272a; border: 1px solid #3f3f46; padding: 24px; border-radius: 12px; width: 100%; max-width: 480px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h1 { font-size: 1.25rem; margin-top: 0; border-bottom: 1px solid #3f3f46; padding-bottom: 12px; }
    .group { margin-bottom: 16px; }
    label { display: block; font-size: 0.85rem; color: #a1a1aa; margin-bottom: 6px; }
    select, button { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #3f3f46; background: #18181b; color: #fff; font-size: 0.9rem; margin-bottom: 8px; cursor: pointer; }
    button { background: #2563eb; font-weight: 600; border: none; }
    button:hover { background: #1d4ed8; }
    .btn-danger { background: #dc2626; }
    .btn-danger:hover { background: #b91c1c; }
    #console-output { background: #09090b; border: 1px solid #27272a; padding: 12px; border-radius: 6px; height: 180px; overflow-y: auto; font-family: monospace; font-size: 0.85rem; color: #4ade80; }
  </style>
</head>
<body>

  <div class="card">
    <h1> Control de Personaje</h1>

    <div class="group">
      <label for="select-arma">Equipar Arma</label>
      <select id="select-arma">
        <option value="espada">Espada de fuego (Daño: 30)</option>
        <option value="arco">Arco mágico (Daño: 20)</option>
      </select>
    </div>

    <div class="group">
      <label for="select-habilidad">Equipar Habilidad</label>
      <select id="select-habilidad">
        <option value="curacion">Curación (Poder: 25)</option>
        <option value="escudo">Escudo mágico (Poder: 15)</option>
      </select>
    </div>

    <div class="group">
      <button id="btn-atacar"> Atacar</button>
      <button id="btn-habilidad"> Usar Habilidad</button>
      <button id="btn-danio" class="btn-danger"> Recibir 20 de Daño</button>
      <button id="btn-reiniciar" style="background: #10b981; display: none;">🔄 Reiniciar Personaje</button>
    </div>

    <label>Consola / Registro de Salida:</label>
    <div id="console-output"></div>
  </div>

  
<script src="./app.js"></script>
</body>
</html>
